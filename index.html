<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cultivar</title>
  <meta name="description" content="Organização e planejamento semanal a partir dos seus objetivos de vida.">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cultivar">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/hoje" aria-label="Cultivar — ir para Hoje">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Cultivar</span>
    </a>
    <nav class="tabs" aria-label="Seções">
      <a href="#/hoje" data-route="hoje">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <span>Hoje</span>
      </a>
      <a href="#/semana" data-route="semana">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9.3 5v14M14.7 5v14"/></svg>
        <span>Minha semana</span>
      </a>
      <a href="#/objetivos" data-route="objetivos">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19c3-4 6-7 10-9"/></svg>
        <span>Meus objetivos</span>
      </a>
    </nav>
    <button class="icon-btn settings-btn" type="button" data-action="open-settings" aria-label="Configurações e backup" title="Configurações e backup">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <button class="fab" type="button" data-action="new-task" aria-label="Nova tarefa">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Nova tarefa</span>
  </button>

  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="confirm" class="confirm" aria-labelledby="confirm-text">
    <form method="dialog">
      <p id="confirm-text"></p>
      <div class="sheet-actions">
        <button class="btn ghost" value="cancel">Cancelar</button>
        <button class="btn danger" value="ok" id="confirm-ok">Confirmar</button>
      </div>
    </form>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <noscript><p class="noscript">Este aplicativo precisa de JavaScript ativado no navegador.</p></noscript>
  <script src="js/app.js" defer></script>
</body>
</html>
